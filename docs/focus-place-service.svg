<rect x="632.0" y="387.0" width="376" height="126" rx="18" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.5"/>
<rect x="640.0" y="395.0" width="360" height="110" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="3.5"/>
<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">place-service  :8084</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">여러 소스가 가리키는 같은 곳을 하나로</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 12개 · 서비스 8개</text>
<text x="632.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="60.0" y="405.0" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2"/>
<text x="180" y="428" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">토큰 검증</text>
<text x="180" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">X-User-Id · X-User-Role 주입</text>
<rect x="670.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 · DB · 카카오 키</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="245.0" width="300" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="270" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  place_db</text>
<text x="1560" y="290" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">place 19,501행 · 소스 연결 · 편의시설</text>
<text x="1560" y="306" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">반영 대기 · 분리 이력  (표 5개 + outbox)</text>
<text x="1560" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">좌표 출처 셋 — 원본 · 변환 · 지오코딩</text>
<rect x="60.0" y="110.0" width="240" height="80" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="180" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">카카오 로컬</text>
<text x="180" y="156" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">좌표가 없는 장소를 주소로</text>
<rect x="1410.0" y="565.0" width="300" height="110" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="590" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">ingest-service</text>
<text x="1560" y="610" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">적재를 넘겨 받음 (bulk)</text>
<text x="1560" y="626" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">원문을 내어 줌 (documents)</text>
<text x="1560" y="642" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">평소에는 안 떠 있음</text>
<rect x="60.0" y="650.0" width="240" height="100" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="180" y="678" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">user-service</text>
<text x="180" y="698" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">즐겨찾기 · 방문 · 일정이</text>
<text x="180" y="714" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">장소 이름과 사진을 물어봄</text>
<rect x="550.0" y="790.0" width="300" height="80" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="700" y="808" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Kafka</text>
<text x="700" y="828" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">place.updated 발행</text>
<text x="700" y="844" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">받는 것은 없음</text>
<rect x="1150.0" y="790.0" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="1300" y="808" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">search-service</text>
<text x="1300" y="828" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">place.updated 를 받으면 다시 읽어 색인</text>
<text x="1300" y="844" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">GET /internal/places/indexing · 아직 없음</text>
<polyline points="300.0,450 640.0,450" fill="none" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#ah-3B82F6)"/>
<rect x="428" y="420" width="103" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="480" y="432" font-size="13" font-weight="normal" text-anchor="middle" fill="#3B82F6">공개 2 · 관리자 7</text>
<polyline points="820,160.0 820,395.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="782" y="258" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="820.0" y="269.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
<polyline points="1000.0,450 1120,450 1120,120 1410.0,120" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="1183" y="193" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">등록</text>
<polyline points="1000.0,450 1120,450 1120,300 1410.0,300" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1103" y="366" width="194" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="378" font-size="13" font-weight="normal" text-anchor="middle" fill="#F97316">JPA · PostGIS · Flyway V20~27</text>
<polyline points="1410,590 1260,590 1260,470 1000,470" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1266" y="533" width="347" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1270" y="545" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">POST /internal/places/bulk   담아 둔 것과 바로 보낸 것 둘 다</text>
<polyline points="1000,505 1160,505 1160,650 1410,650" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1166" y="688" width="249" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1170" y="700" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/raw/{placeId}/documents</text>
<polyline points="300.0,700 480,700 480,480 640,480" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="306" y="648" width="165" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="310" y="660" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/places?ids=</text>
<polyline points="900,505 900,660 780,660 780,790" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="906" y="588" width="186" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="910" y="600" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">Outbox 로 발행  (수신하지 않음)</text>
<polyline points="850.0,830 1150.0,830" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="996" y="810" width="97" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1000" y="822" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">place.updated</text>
<polyline points="640.0,450 480,450 480,150 300.0,150" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="486" y="288" width="90" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="490" y="300" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">지오코딩 · 3초</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">소스가 넷이라 같은 곳이 네 번 들어옴 — 주소가 같고 이름이 같으면 합치고, 아니면 100m 안에서 이름이 같을 때만 합침 · 관리자가 고친 장소는 잠겨 수집이 건드리지 않고 대기 목록에 쌓임</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">좌표 출처가 셋이고 조합마다 기준이 다름 — 원본끼리와 변환이 낀 것은 100m, 지오코딩이 낀 것은 300m, 지오코딩끼리는 합치지 않음</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">이 서비스만 Outbox Relay 가 켜져 있음 — 인스턴스를 늘리면 같은 행을 두 번 집으므로 한 대만 켜지도록 갈라야 함</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">place-service 를 중심으로 · 직접 연결된 것만</text></svg>